name: Deploy frontend

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VITE_API_ORIGIN: ${{ vars.MANGROVE_API_ORIGIN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Validate deployment configuration
        run: |
          test -n "$VITE_API_ORIGIN" || { echo 'Set MANGROVE_API_ORIGIN to the private HTTPS API origin'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set the CLOUDFLARE_API_TOKEN secret'; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run --filter @mangrove/shared check
      - run: bun run --filter @mangrove/web check
      - run: bun run build
      - name: Deploy frontend assets
        run: bunx wrangler@4.152.0 deploy --config apps/web/wrangler.jsonc
